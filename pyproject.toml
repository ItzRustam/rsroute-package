[project]
name = "rsroute"
version = "0.1.0"
description = "Python Package Wrapper for RSRoute server"
readme = "README.md"
authors = [
    { name = "ItzRustam", email = "rustambhadouriya7@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
rsroute-lib = "rsroute:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
