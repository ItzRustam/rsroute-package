[project]
name = "rsroute"
version = "0.1.1"
description = "Python Package Wrapper for RSRoute server"
readme = "README.md"
authors = [
    { name = "ItzRustam", email = "rustambhadouriya7@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "requests",
    "langchain-core",
    "rich",
    "python-dotenv",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
